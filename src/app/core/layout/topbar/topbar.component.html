<header
  class="sticky top-0 z-20 flex min-h-16 items-center justify-between gap-4 border-b border-[#c6d2ca] bg-white/95 px-5 sm:px-8"
  (click)="profileMenuOpen = false"
>
  <button class="grid size-10 place-items-center rounded border border-[#c6d2ca] text-[#005f43] lg:hidden" type="button" aria-label="Open navigation" (click)="menuRequested.emit()"><i class="uil uil-bars text-xl" aria-hidden="true"></i></button>
  <p class="mr-auto text-sm font-semibold text-[#07182d]">OrderBridge control centre</p>

  <div class="flex items-center gap-4" (click)="$event.stopPropagation()">
    <div class="relative">
      <button
        class="flex items-center gap-2 border-0 bg-transparent text-[0.86rem] font-normal text-[#27344c]"
        type="button"
        (click)="profileMenuOpen = !profileMenuOpen"
      >
        <span class="hidden sm:inline">{{ adminName }}</span>
        <span class="grid size-8 place-items-center overflow-hidden rounded-full border border-[#c6d2ca] bg-[#e6f7ed] text-[0.65rem] font-bold text-[#005f43]">@if (adminPhotoUrl) {<img
          class="size-8 rounded-full border border-[#c6d2ca] object-cover"
          [src]="adminPhotoUrl"
          [alt]="adminName + ' profile photo'"
          (error)="profileImageFailed = true"
        />} @else {<span>{{ adminInitials }}</span>}</span>
      </button>

      @if (profileMenuOpen) {
        <div class="absolute right-0 top-[calc(100%+0.7rem)] grid min-w-52 gap-3 rounded-md border border-[#c6d2ca] bg-white p-3 shadow-[0_14px_34px_rgba(15,23,42,0.12)]">
          <div><p class="truncate text-[0.86rem] font-bold text-[#07182d]">{{ adminName }}</p><small class="block truncate text-[0.72rem] text-[#48566d]">{{ adminEmail }}</small></div>
          <button
            class="inline-flex min-h-9 items-center justify-center gap-2 rounded border border-[#c6d2ca] bg-[#f4f7fb] px-3 text-[0.8rem] font-bold text-[#005f43]"
            type="button"
            (click)="logout()"
          >
            <i class="uil uil-signout" aria-hidden="true"></i>
            <span>{{ isLoggingOut ? 'Signing out...' : 'Logout' }}</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
