<label class="flex min-h-9 w-[min(100%,28rem)] items-center gap-3 rounded-md border border-transparent bg-[#eef4ff] px-3 text-[#4c5870]">
  <i class="uil uil-search text-[1.1rem]" aria-hidden="true"></i>
  <input
    class="min-w-0 flex-1 border-0 bg-transparent text-[0.88rem] text-[#07182d] outline-none placeholder:text-[#6e798d]"
    type="search"
    name="globalSearch"
    [ngModel]="value"
    (ngModelChange)="valueChange.emit($event)"
    [placeholder]="placeholder"
    autocomplete="off"
  />
</label>
